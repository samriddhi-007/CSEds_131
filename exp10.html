<html>

<body>
    <p id="result"></p>

    <script>
        let a = 10;
        let b = 5;
        let sum = a + b;
        let difference = a - b;
        let product = a * b;
        let division = a / b;

        document.getElementById("result").innerHTML =
            "Sum: " + sum +
            "<br>Difference: " + difference +
            "<br>Product: " + product +
            "<br>Division: " + division;
    </script>

</body>

</html>
