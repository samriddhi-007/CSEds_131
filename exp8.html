<html>

<head>
    <style>
        .float {
            float: left;
            background: lightblue;
            padding: 20px;
        }

        .inline {
            display: inline-block;
            background: lightgreen;
            padding: 20px;
        }

        .flex {
            display: flex;
            gap: 10px;
        }

        .flex div {
            background: lightpink;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h3>Float</h3>
    <div class="float">Box 1</div>
    <div style="clear:both;"></div>

    <h3>Inline-block</h3>
    <div class="inline">Box 1</div>
    <div class="inline">Box 2</div>

    <h3>Flexbox</h3>
    <div class="flex">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

</body>

</html>
