<html>

<body>

    <p id="result"></p>

    <script>
        let number = 10;
        let output = "";
        if (number % 2 == 0) {
            output = "Even Number<br>";
        } else {
            output = "Odd Number<br>";
        }
        for (let i = 1; i <= 5; i++) {
            output += i + "<br>";
        }

        document.getElementById("result").innerHTML = output;
    </script>

</body>

</html>
